  <line x1="30.0" y1="150" x2="290.0" y2="150" stroke="#fff" stroke-width="2.5" opacity=".95"/>
  <path d="M145.1,40 L174.9,40 L192.7,120 L127.3,120 Z" fill="url(#hold)" opacity=".75"/>
  <rect x="143.1" y="36.7" width="33.8" height="6.7" rx="3.3" fill="url(#n-hold)" stroke="#fff" stroke-opacity=".8" stroke-width="1"/>
  <rect x="125.3" y="114.0" width="69.3" height="12.0" rx="6.0" fill="url(#n-hold)" stroke="#fff" stroke-opacity=".85" stroke-width="1" filter="url(#soft)"/>
  <text x="160" y="100" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="800" font-style="italic" fill="#fff" opacity=".35" letter-spacing="2">READY</text>
