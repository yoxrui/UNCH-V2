<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1026" stop-opacity="0"/><stop offset=".55" stop-color="#0b1026" stop-opacity=".28"/><stop offset="1" stop-color="#0b1026" stop-opacity=".75"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#67e8f9" stop-opacity="0"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
    <linearGradient id="n-tap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="n-crit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef08a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="n-flick" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbcfe8"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="n-hold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bbf7d0"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
    <linearGradient id="hold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ade80" stop-opacity=".15"/><stop offset="1" stop-color="#4ade80" stop-opacity=".55"/></linearGradient>
    <filter id="glow" x="-50%" y="-5%" width="200%" height="110%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bloom" x="-5%" y="-300%" width="110%" height="700%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b"/><feFlood flood-color="#fff" flood-opacity=".5"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <path d="M130,0 L190,0 L310,180 L10,180 Z" fill="url(#road)"/>
  <line x1="140.0" y1="0" x2="60.0" y2="180" stroke="#fff" stroke-opacity="0.22" stroke-width="1.2"/>
  <line x1="150.0" y1="0" x2="110.0" y2="180" stroke="#fff" stroke-opacity="0.22" stroke-width="1.2"/>
  <line x1="160.0" y1="0" x2="160.0" y2="180" stroke="#fff" stroke-opacity="0.22" stroke-width="1.2"/>
  <line x1="170.0" y1="0" x2="210.0" y2="180" stroke="#fff" stroke-opacity="0.22" stroke-width="1.2"/>
  <line x1="180.0" y1="0" x2="260.0" y2="180" stroke="#fff" stroke-opacity="0.22" stroke-width="1.2"/>
  <line x1="130.0" y1="0" x2="10.0" y2="180" stroke="url(#edge)" stroke-width="3" filter="url(#glow)" opacity="0.7"/>
  <line x1="190.0" y1="0" x2="310.0" y2="180" stroke="url(#edge)" stroke-width="3" filter="url(#glow)" opacity="0.7"/>
